server {
    listen 127.0.0.1:8081;
    server_name _;

    auth_basic "HydraNet Demo";
    auth_basic_user_file /etc/nginx/.hydranet_users;

    # Dashboard
    location = / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8080;
    }

    location = /index.html {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8080;
    }

    # Network state
    location = /state {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080/state;
    }

    # Controller events
    location = /events {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080/events;
    }

    # AI status
    location = /ai/status {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5000/status;
    }

    # AI execution
    location = /ai/run {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:5000/run;
    }

    # Everything else is denied
    location / {
        return 404;
    }
}
