<!DOCTYPE html><html><head><meta charset="utf-8"><title>SDN Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f4f4f2;--mut:#777;--ok:#1D9E75;--bad:#E24B4A}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--card:#222;--mut:#999}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
h1{font-size:18px;margin:0}h2{font-size:14px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:8px;padding:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}td{padding:3px 4px}
.mono{font-family:ui-monospace,monospace}
ul{list-style:none;margin:0;padding:0;max-height:170px;overflow:auto}
li{padding:2px 0;font-size:12px}
#st{padding:2px 10px;border-radius:10px;background:var(--ok);color:#fff;font-size:12px}
.bar{height:6px;border-radius:3px;min-width:2px}
</style></head><body>
<div class="top"><h1>SDN Controller Dashboard</h1><span id="st">connecting</span></div>
<div class="grid">
 <div class="card"><h2>Network topology (green = active path, red = heavy)</h2>
  <svg id="svg" viewBox="0 0 600 440" width="100%"></svg></div>
 <div>
  <div class="card" style="margin-bottom:12px"><h2>Hosts</h2><table id="hosts"></table></div>
  <div class="card"><h2>Current paths</h2><table id="paths"></table></div>
 </div>
</div>
<div class="grid">
 <div class="card"><h2>Port load</h2><table id="load"></table></div>
 <div>
  <div class="card" style="margin-bottom:12px"><h2>Network changes</h2><ul id="notes"></ul></div>
  <div class="card"><h2>Rules from LLM / validator</h2><ul id="events"></ul></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const short=m=>m.slice(-8);
let prev=null,notes=[];
const note=t=>{notes.unshift(new Date().toLocaleTimeString()+'  '+t);notes=notes.slice(0,50)};

function draw(s){
 const sw=s.switches,n=sw.length,cx=300,cy=230,R=110,pos={};
 sw.forEach((id,i)=>{const a=2*Math.PI*i/n-Math.PI/2;pos[id]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),a}});
 const onPath=new Set();
 Object.values(s.paths).forEach(p=>p&&p.slice(1).forEach((b,i)=>onPath.add([p[i],b].sort().join('-'))));
 const rates=s.port_load_bytes_per_sec;
 let h='';
 s.links.forEach(l=>{
  const a=pos[l.src],b=pos[l.dst];if(!a||!b)return;
  const r=Math.max((rates[l.src]||{})[l.src_port]||0,(rates[l.dst]||{})[l.dst_port]||0);
  const heavy=r>s.heavy_threshold,on=onPath.has([l.src,l.dst].sort().join('-'));
  h+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${heavy?'#E24B4A':on?'#1D9E75':'#999'}" stroke-width="${on?4:2}"/>`;
 });
 Object.entries(s.hosts).forEach(([m,l])=>{
  const p=pos[l.switch];if(!p)return;
  const x=p.x+75*Math.cos(p.a),y=p.y+75*Math.sin(p.a);
  h+=`<line x1="${p.x}" y1="${p.y}" x2="${x}" y2="${y}" stroke="#999" stroke-dasharray="4"/>
  <rect x="${x-30}" y="${y-12}" width="60" height="24" rx="5" fill="${s.blocked.includes(m)?'#E24B4A':'#378ADD'}"/>
  <text x="${x}" y="${y+4}" text-anchor="middle" fill="#fff" font-size="10">${short(m)}</text>`;
 });
 sw.forEach(id=>{const p=pos[id];
  h+=`<circle cx="${p.x}" cy="${p.y}" r="18" fill="#7F77DD"/><text x="${p.x}" y="${p.y+4}" text-anchor="middle" fill="#fff" font-size="12">s${id}</text>`});
 $('svg').innerHTML=h;

 $('hosts').innerHTML=Object.entries(s.hosts).map(([m,l])=>
  `<tr><td class="mono">${m}</td><td>s${l.switch}:${l.port}</td><td>${s.blocked.includes(m)?'BLOCKED':''}</td></tr>`).join('')
  ||'<tr><td>none yet - run h1 ping h2 in Mininet</td></tr>';
 $('paths').innerHTML=Object.entries(s.paths).map(([k,p])=>
  `<tr><td class="mono">${k.split('->').map(short).join(' → ')}</td><td>${p?p.map(x=>'s'+x).join(' → '):'no path'}</td></tr>`).join('');
 $('load').innerHTML=Object.entries(rates).flatMap(([d,ps])=>Object.entries(ps).map(([p,r])=>
  `<tr><td>s${d}:${p}</td><td style="width:55%"><div class="bar" style="width:${Math.min(100,r/s.heavy_threshold*100)}%;background:${r>s.heavy_threshold?'#E24B4A':'#1D9E75'}"></div></td><td>${Math.round(r)} B/s</td></tr>`)).join('');

 const key={l:s.links.length,p:JSON.stringify(s.paths),b:s.blocked.join()};
 if(prev){
  if(key.l!==prev.l)note(`links: ${prev.l} → ${key.l}`);
  if(key.p!==prev.p)note('paths changed');
  if(key.b!==prev.b)note('blocked list changed');
 }
 prev=key;
 $('notes').innerHTML=notes.map(x=>`<li>${esc(x)}</li>`).join('')||'<li style="color:var(--mut)">no changes yet</li>';
}

function drawEvents(e){
 $('events').innerHTML=e.slice().reverse().map(x=>
  `<li style="color:${x.ok?'var(--ok)':'var(--bad)'}">${new Date(x.t*1000).toLocaleTimeString()}  ${x.ok?'ACCEPTED':'REJECTED'}  ${esc(x.rule)} — ${esc(x.msg)}</li>`).join('')
  ||'<li style="color:var(--mut)">no rules received yet</li>';
}

async function tick(){
 try{
  const [s,e]=await Promise.all([fetch('/state').then(r=>r.json()),fetch('/events').then(r=>r.json())]);
  if(s.error)throw 0;
  draw(s);drawEvents(e);
  $('st').textContent='live';$('st').style.background='';
 }catch(x){$('st').textContent='controller unreachable';$('st').style.background='#E24B4A'}
}
tick();setInterval(tick,2000);
</script></body></html>
